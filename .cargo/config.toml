# ---------------------------------------------------------------------------
# Build configuration.
#
# This project used to vendor the full source of all 383 crates in Cargo.lock
# into `vendor/` and point cargo at it, so a build never touched the network.
# That cost 565 MB on disk and has been removed; cargo now resolves through the
# normal crates.io registry, backed by the shared package cache in
# ~/.cargo/registry.
#
# Practical consequence: the first build on a machine with a cold cache needs
# network. Once ~/.cargo/registry has the crates, `cargo build --offline`
# works again — the cache is shared across every project on the machine, so
# it usually already does.
#
# To go back to vendoring (see docs/04-offline-workflow.md):
#
#     cargo vendor --versioned-dirs
#
# and restore the [source] section it prints.
# ---------------------------------------------------------------------------
